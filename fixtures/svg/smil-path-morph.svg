<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!-- SMIL attributeName="d": morphs a square into a diamond and back. -->
	<path fill="#ffaa40">
		<animate
			attributeName="d"
			values="
				M20,20 L80,20 L80,80 L20,80 Z;
				M50,10 L90,50 L50,90 L10,50 Z;
				M20,20 L80,20 L80,80 L20,80 Z
			"
			dur="3s"
			repeatCount="indefinite"
		/>
	</path>
</svg>
