<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!-- CSS @keyframes in an internal <style>: a pulsing circle. -->
	<style>
		@keyframes pulse {
			0% {
				r: 8;
				opacity: 1;
			}
			50% {
				r: 20;
				opacity: 0.4;
			}
			100% {
				r: 8;
				opacity: 1;
			}
		}
		.pulse {
			animation: pulse 2s ease-in-out infinite;
		}
	</style>
	<circle class="pulse" cx="50" cy="50" r="8" fill="#a78bfa" />
</svg>
