<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Spindle Lab</title>
  <desc id="hero-desc">Desktop laboratory app. A dark-themed banner with an animated flask baking a vector shape into a filmstrip of video frames.</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Brand gradient: orange to pink to purple -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa40"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Flask liquid: cyan to purple -->
    <linearGradient id="flask-liquid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5aa2ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Bake beam: the conversion arrow from flask to filmstrip -->
    <linearGradient id="bake-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa40" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffaa40" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffaa40" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Flask clip: liquid stays inside the glass -->
    <clipPath id="flask-clip">
      <path d="M925 90 L925 130 L890 210 A40 40 0 0 0 926 264 L974 264 A40 40 0 0 0 1010 210 L975 130 L975 90 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow circles -->
  <g opacity="0.08">
    <circle cx="950" cy="160" r="200" fill="#a78bfa"/>
    <circle cx="200" cy="80" r="150" fill="#ffaa40"/>
    <circle cx="600" cy="260" r="160" fill="#5aa2ff"/>
  </g>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#5aa2ff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Title -->
  <text x="80" y="68" font-size="42" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" letter-spacing="-0.02em" fill="url(#brand)" filter="url(#text-glow)">Spindle Lab</text>

  <!-- Tagline -->
  <text x="82" y="96" fill="#b4bfce" font-size="16" font-family="'Inter', system-ui, sans-serif">Desktop laboratory for prototyping Spindle authoring techniques</text>

  <!-- Tech badge -->
  <g transform="translate(80, 118)">
    <rect width="200" height="38" rx="10" fill="#0f1520" stroke="#2e3540" stroke-width="1"/>
    <text x="16" y="25" font-size="14" font-family="monospace">
      <tspan fill="#7c8796">tauri</tspan><tspan fill="#2e3540"> + </tspan><tspan fill="#5aa2ff">react</tspan><tspan fill="#2e3540"> + </tspan><tspan fill="#ffaa40">rust</tspan>
    </text>
  </g>

  <!-- Flask: the source, an animated vector shape being cooked down -->
  <g>
    <!-- Glass outline -->
    <path d="M925 90 L925 130 L890 210 A40 40 0 0 0 926 264 L974 264 A40 40 0 0 0 1010 210 L975 130 L975 90 Z" fill="none" stroke="#2e3540" stroke-width="1.5"/>
    <line x1="915" y1="90" x2="985" y2="90" stroke="#2e3540" stroke-width="1.5"/>

    <!-- Liquid fill -->
    <g clip-path="url(#flask-clip)">
      <rect x="885" y="185" width="130" height="90" fill="url(#flask-liquid)"/>
      <!-- Rising bubbles -->
      <circle cx="930" cy="255" r="3" fill="#5aa2ff" opacity="0.7">
        <animate attributeName="cy" values="255;195;255" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="260" r="2.5" fill="#a78bfa" opacity="0.6">
        <animate attributeName="cy" values="260;190;260" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="965" cy="258" r="2" fill="#5aa2ff" opacity="0.5">
        <animate attributeName="cy" values="258;198;258" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- The animated vector shape floating in the flask -->
    <g transform="translate(950, 210)" filter="url(#glow)">
      <polygon points="0,-16 14,-5 9,13 -9,13 -14,-5" fill="none" stroke="#ffaa40" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Glass highlight -->
    <path d="M918 128 L900 178" stroke="#5aa2ff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Bake beam: flask to filmstrip -->
  <g transform="translate(0, 210)">
    <line x1="1015" y1="0" x2="1100" y2="0" stroke="url(#bake-beam)" stroke-width="2"/>
    <circle r="3" fill="#ffaa40" opacity="0.9">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M1015 0 L1100 0"/>
    </circle>
  </g>

  <!-- Filmstrip: the baked output, frame by frame -->
  <g transform="translate(1100, 175)">
    <rect x="0" y="0" width="70" height="70" rx="4" fill="none" stroke="#2e3540" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="8" y2="10" stroke="#2e3540" stroke-width="1"/>
    <line x1="0" y1="24" x2="8" y2="24" stroke="#2e3540" stroke-width="1"/>
    <line x1="0" y1="38" x2="8" y2="38" stroke="#2e3540" stroke-width="1"/>
    <line x1="0" y1="52" x2="8" y2="52" stroke="#2e3540" stroke-width="1"/>
    <line x1="62" y1="10" x2="70" y2="10" stroke="#2e3540" stroke-width="1"/>
    <line x1="62" y1="24" x2="70" y2="24" stroke="#2e3540" stroke-width="1"/>
    <line x1="62" y1="38" x2="70" y2="38" stroke="#2e3540" stroke-width="1"/>
    <line x1="62" y1="52" x2="70" y2="52" stroke="#2e3540" stroke-width="1"/>
    <!-- The frozen frame, cycling through the shape's baked poses -->
    <polygon points="35,20 43,29 40,43 30,43 27,29" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" values="0 35 35;90 35 35;180 35 35;270 35 35;360 35 35" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bottom info line -->
  <text x="80" y="290" fill="#7c8796" font-size="13" font-family="monospace">
    <tspan fill="#9aa4b2">labs</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">svg</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">bake</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">render</tspan>
    <tspan fill="#2e3540">  &#x2022;  </tspan>
    <tspan fill="#7c8796">Liminal HQ</tspan>
  </text>
</svg>
